name: DataTrust quality checks

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -v
        env:
          PYTHONPATH: src
      - run: dbt seed --project-dir dbt --profiles-dir dbt && dbt build --project-dir dbt --profiles-dir dbt
