version: 2
models:
  - name: stg_orders
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]
      - name: order_date
        tests: [not_null]
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['pending', 'paid', 'shipped', 'cancelled']
      - name: quantity
        tests: [not_null]
      - name: unit_price
        tests: [not_null]
  - name: dim_customers
    columns:
      - name: customer_id
        tests: [not_null, unique]
  - name: fct_orders
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

